<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | PlacementAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      color: white;
    }
    .logo { font-size: 1.4rem; font-weight: 700; color: #7c6ff7; margin-bottom: 0.5rem; }
    h2 { font-size: 1.5rem; margin-bottom: 0.3rem; }
    .sub { opacity: 0.5; font-size: 0.9rem; margin-bottom: 2rem; }
    label { font-size: 0.85rem; opacity: 0.7; display: block; margin-bottom: 0.3rem; }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: white;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #7c6ff7; }
    input::placeholder { opacity: 0.4; }
    button {
      width: 100%;
      padding: 0.85rem;
      background: #7c6ff7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    button:hover { background: #6c5fe6; }
    button:disabled { background: #4a4580; cursor: not-allowed; }
    .error {
      background: rgba(255,80,80,0.15);
      border: 1px solid rgba(255,80,80,0.3);
      color: #ff6b6b;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      opacity: 0.6;
    }
    .login-link a { color: #7c6ff7; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎯 PlacementAI</div>
    <h2>Create Account</h2>
    <p class="sub">Start your placement journey today</p>

    <div class="error" id="error"></div>

    <label>Full Name</label>
    <input type="text" id="fullName" placeholder="Lalith Kishore">

    <label>Username</label>
    <input type="text" id="username" placeholder="lalith">

    <label>Email</label>
    <input type="email" id="email" placeholder="lalith@example.com">

    <label>Password</label>
    <input type="password" id="password" placeholder="Min 6 characters">

    <button onclick="register()" id="btn">Create Account</button>

    <div class="login-link">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script>
    async function register() {
      const fullName = document.getElementById("fullName").value.trim();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorDiv = document.getElementById("error");
      const btn = document.getElementById("btn");

      errorDiv.style.display = "none";

      if (!fullName || !username || !email || !password) {
        errorDiv.textContent = "Please fill in all fields.";
        errorDiv.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating account...";

      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fullName, username, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          errorDiv.textContent = data.message || "Registration failed.";
          errorDiv.style.display = "block";
          return;
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("username", data.username);
        localStorage.setItem("fullName", data.fullName);
        window.location.href = "dashboard.html";

      } catch (err) {
        errorDiv.textContent = "Something went wrong. Please try again.";
        errorDiv.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    }
  </script>
</body>
</html>
